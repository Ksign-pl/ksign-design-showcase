name: Lighthouse CI — staging (mobile, non-blocking)

# Runs alongside the production Lighthouse CI workflow. Targets
# https://staging.ksign.pl with the same mobile emulation profile (Slow 4G,
# 4x CPU slowdown, 3 runs), but all assertions are "warn" — results show up
# in the PR comment but never fail the check.
#
# Staging gating: if the environment is behind HTTP Basic Auth, set repo
# secrets STAGING_BASIC_AUTH_USER + STAGING_BASIC_AUTH_PASS. They are
# injected into Lighthouse as an `Authorization: Basic …` header via
# .lighthouserc.staging.cjs. Without them, the audit runs unauthenticated.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lhci-staging:
    name: Lighthouse CI — staging (mobile, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check staging is reachable
        id: staging_up
        env:
          STAGING_BASIC_AUTH_USER: ${{ secrets.STAGING_BASIC_AUTH_USER }}
          STAGING_BASIC_AUTH_PASS: ${{ secrets.STAGING_BASIC_AUTH_PASS }}
        run: |
          AUTH_ARGS=()
          if [ -n "$STAGING_BASIC_AUTH_USER" ] && [ -n "$STAGING_BASIC_AUTH_PASS" ]; then
            AUTH_ARGS=(-u "$STAGING_BASIC_AUTH_USER:$STAGING_BASIC_AUTH_PASS")
            echo "Using Basic Auth for staging health check."
          fi
          if curl -sfI --max-time 10 "${AUTH_ARGS[@]}" https://staging.ksign.pl/ > /dev/null; then
            echo "Staging is reachable."
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::staging.ksign.pl is not reachable — skipping Lighthouse CI staging audit."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Lighthouse CI
        if: steps.staging_up.outputs.ok == 'true'
        run: npm install -g @lhci/cli@0.14.x

      - name: Run Lighthouse CI against staging
        if: steps.staging_up.outputs.ok == 'true'
        run: lhci autorun --config=./.lighthouserc.staging.cjs
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          STAGING_BASIC_AUTH_USER: ${{ secrets.STAGING_BASIC_AUTH_USER }}
          STAGING_BASIC_AUTH_PASS: ${{ secrets.STAGING_BASIC_AUTH_PASS }}
