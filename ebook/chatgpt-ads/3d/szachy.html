<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        background: #fff;
      }
      canvas {
        display: block;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "./node_modules/three/build/three.module.js",
          "three/addons/": "./node_modules/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <script type="module">
      import * as THREE from "three";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { BokehPass } from "three/addons/postprocessing/BokehPass.js";
      import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
      import { GTAOPass } from "three/addons/postprocessing/GTAOPass.js";
      import { mergeVertices } from "three/addons/utils/BufferGeometryUtils.js";

      const W = 1080,
        H = 1350,
        S = Math.max(2, window.devicePixelRatio * 1.5); // supersampling
      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(S);
      renderer.setSize(W, H);
      renderer.toneMapping = THREE.NeutralToneMapping;
      renderer.toneMappingExposure = 1.0;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.VSMShadowMap;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xf5f4f1);
      scene.fog = new THREE.Fog(0xf5f4f1, 10, 22);
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
      scene.environmentIntensity = 0.38;

      const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
      camera.position.set(0, 3.0, 10.8);
      camera.lookAt(0, 1.55, 0);

      // szachownica
      const cv = document.createElement("canvas");
      cv.width = cv.height = 1024;
      const g = cv.getContext("2d");
      for (let i = 0; i < 8; i++)
        for (let j = 0; j < 8; j++) {
          g.fillStyle = (i + j) % 2 ? "#1c1c1c" : "#d9d7d2";
          g.fillRect(i * 128, j * 128, 128, 128);
        }
      const tex = new THREE.CanvasTexture(cv);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      const board = new THREE.Mesh(
        new THREE.PlaneGeometry(60, 60),
        new THREE.MeshPhysicalMaterial({
          map: tex,
          roughness: 0.32,
          clearcoat: 0.35,
          clearcoatRoughness: 0.25,
        }),
      );
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(7.5, 7.5);
      board.rotation.x = -Math.PI / 2;
      board.receiveShadow = true;
      scene.add(board);

      function lathe(profile, seg = 96) {
        const pts = profile.map(([r, y]) => new THREE.Vector2(r, y));
        let geo = new THREE.LatheGeometry(pts, seg);
        geo.deleteAttribute("uv");
        geo.deleteAttribute("normal");
        geo = mergeVertices(geo, 1e-4);
        geo.computeVertexNormals();
        return geo;
      }
      // pionek: profil (promień, wysokość)
      const pawnProfile = [
        [0, 0],
        [0.42, 0],
        [0.44, 0.04],
        [0.44, 0.1],
        [0.38, 0.14],
        [0.34, 0.18],
        [0.36, 0.22],
        [0.3, 0.26],
        [0.2, 0.34],
        [0.15, 0.5],
        [0.13, 0.62],
        [0.2, 0.66],
        [0.22, 0.7],
        [0.14, 0.74],
        [0.19, 0.8],
        [0.23, 0.88],
        [0.23, 0.96],
        [0.19, 1.04],
        [0.12, 1.09],
        [0.0, 1.11],
      ];
      const pawnGeo = lathe(pawnProfile);
      // hetman
      const queenProfile = [
        [0, 0],
        [0.56, 0],
        [0.58, 0.05],
        [0.58, 0.13],
        [0.5, 0.18],
        [0.44, 0.23],
        [0.47, 0.28],
        [0.4, 0.33],
        [0.28, 0.45],
        [0.22, 0.7],
        [0.18, 1.0],
        [0.17, 1.25],
        [0.26, 1.3],
        [0.29, 1.35],
        [0.2, 1.39],
        [0.22, 1.44],
        [0.3, 1.6],
        [0.36, 1.74],
        [0.34, 1.77],
        [0.25, 1.72],
        [0.0, 1.72],
      ];
      const queenGeo = lathe(queenProfile);

      const grayMat = new THREE.MeshPhysicalMaterial({
        color: 0xb9b8b4,
        roughness: 0.35,
        clearcoat: 0.5,
        clearcoatRoughness: 0.25,
      });
      const darkMat = new THREE.MeshPhysicalMaterial({
        color: 0x2a2a2a,
        roughness: 0.3,
        clearcoat: 0.6,
        clearcoatRoughness: 0.2,
      });
      const orangeMat = new THREE.MeshPhysicalMaterial({
        color: new THREE.Color("#e8940c"),
        roughness: 0.2,
        clearcoat: 1.0,
        clearcoatRoughness: 0.06,
      });

      const queen = new THREE.Group();
      const qBody = new THREE.Mesh(queenGeo, orangeMat);
      qBody.castShadow = true;
      queen.add(qBody);
      // korona: pierścień kulek na krawędzi, kopułka i kulka na szczycie
      for (let k = 0; k < 12; k++) {
        const a = (k / 12) * Math.PI * 2;
        const ball = new THREE.Mesh(new THREE.SphereGeometry(0.055, 32, 20), orangeMat);
        ball.position.set(Math.cos(a) * 0.33, 1.79, Math.sin(a) * 0.33);
        ball.castShadow = true;
        queen.add(ball);
      }
      const dome = new THREE.Mesh(
        lathe([
          [0, 1.66],
          [0.24, 1.68],
          [0.22, 1.76],
          [0.15, 1.83],
          [0.07, 1.87],
          [0.05, 1.9],
          [0.08, 1.93],
          [0.0, 1.95],
        ]),
        orangeMat,
      );
      dome.castShadow = true;
      queen.add(dome);
      const finial = new THREE.Mesh(new THREE.SphereGeometry(0.085, 40, 28), orangeMat);
      finial.position.y = 2.0;
      finial.castShadow = true;
      queen.add(finial);
      queen.position.set(0, 0, 0);
      queen.scale.setScalar(1.25);
      scene.add(queen);

      // przewrócone i stojące pionki
      const rnd = (() => {
        let s = 7;
        return () => (s = (s * 16807) % 2147483647) / 2147483647;
      })();
      const placed = [];
      function addPawn(x, z, fallen, mat) {
        const m = new THREE.Mesh(pawnGeo, mat);
        m.castShadow = true;
        m.receiveShadow = true;
        if (fallen) {
          const grp = new THREE.Group();
          m.rotation.z = Math.PI / 2;
          m.position.y = 0.0;
          // leży na boku: oś pionka w poziomie
          m.position.set(0, 0.43, 0);
          grp.add(m);
          grp.rotation.y = (rnd() - 0.5) * 1.1 + (rnd() > 0.5 ? Math.PI : 0);
          grp.position.set(x, 0, z);
          scene.add(grp);
        } else {
          m.position.set(x, 0, z);
          scene.add(m);
        }
      }
      const spots = [
        [-1.25, 1.2, 1],
        [1.35, 1.05, 1],
        [0.35, 2.35, 1],
        [-0.55, 3.1, 1],
        [1.9, 2.9, 1],
        [-2.1, 2.4, 1],
        [2.7, 1.6, 1],
        [-2.9, 1.3, 1],
        [-1.5, -1.0, 0],
        [1.6, -1.2, 0],
        [-2.8, -1.9, 0],
        [2.9, -2.1, 0],
        [0.6, -2.4, 0],
        [-0.9, -2.9, 0],
        [-3.9, 0.1, 1],
        [3.9, -0.1, 1],
        [-4.2, -3.2, 0],
        [4.1, -3.5, 0],
      ];
      for (const [x, z, f] of spots) addPawn(x, z, !!f, rnd() > 0.5 ? grayMat : darkMat);

      // światło
      const key = new THREE.DirectionalLight(0xffffff, 3.4);
      key.position.set(-4, 9, 5);
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      key.shadow.radius = 10;
      key.shadow.blurSamples = 20;
      key.shadow.camera.left = -7;
      key.shadow.camera.right = 7;
      key.shadow.camera.top = 7;
      key.shadow.camera.bottom = -7;
      key.shadow.bias = -0.0005;
      scene.add(key);
      const fill = new THREE.DirectionalLight(0xffffff, 0.6);
      fill.position.set(4, 3, 5);
      scene.add(fill);
      const rim = new THREE.DirectionalLight(0xffffff, 0.9);
      rim.position.set(0, 4, -6);
      scene.add(rim);

      const composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));
      const gtao = new GTAOPass(scene, camera, W, H);
      gtao.updateGtaoMaterial({
        radius: 0.6,
        distanceExponent: 1.5,
        thickness: 1.0,
        scale: 1.0,
        samples: 16,
      });
      gtao.blendIntensity = 0.9;
      composer.addPass(gtao);
      const focus = camera.position.distanceTo(new THREE.Vector3(0, 1.4, 0));
      const bokeh = new BokehPass(scene, camera, { focus, aperture: 0.0035, maxblur: 0.012 });
      composer.addPass(bokeh);
      composer.addPass(new OutputPass());
      composer.render();
      window.__done = true;
    </script>
  </body>
</html>
